name: Android APK Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Python 3.12 for Chaquopy
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make Gradle wrapper executable
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: android-app
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          EP_BUILD_DIR: ${{ github.workspace }}/build-epdownloader/app
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK for this tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: cp "build-epdownloader/app/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/MediaDownloader-${TAG_NAME}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-${{ github.ref_name }}
          path: ${{ runner.temp }}/MediaDownloader-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Select release notes
        id: release-notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          notes="release/RELEASE_NOTES-${TAG_NAME}.md"
          if [ -f "$notes" ]; then
            echo "body_path=$notes" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: Media Downloader ${{ github.ref_name }}
          body_path: ${{ steps.release-notes.outputs.body_path }}
          generate_release_notes: ${{ steps.release-notes.outputs.generate }}
          files: ${{ runner.temp }}/MediaDownloader-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
